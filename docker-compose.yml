name: pasalapeli

services:
  movie-service:
    container_name: pasalapeli-movie
    restart: unless-stopped
    build:
      context: ../pasalapeli-movie-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Definir SPRING_DATASOURCE_URL en .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-pasalapeli}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pasalapeli123}
      # Fail-closed: Azure AD activo por defecto; solo false en dev/demo local explicito
      AZURE_AUTH_ENABLED: ${AZURE_AUTH_ENABLED:-true}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      AZURE_APP_ID_URI: ${AZURE_APP_ID_URI:-api://00000000-0000-0000-0000-000000000000}
      AZURE_AD_ISSUER_URI: ${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/common/v2.0}
      AZURE_AD_JWK_SET_URI: ${AZURE_AD_JWK_SET_URI:-https://login.microsoftonline.com/common/discovery/v2.0/keys}
      # Mensajeria asincrona (AWS SNS); credenciales via IMDS/LabRole
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
      # Token interno para /descontar|/reponer (solo ticket-service lo envia)
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
    volumes:
      - movie-uploads:/app/uploads
    networks:
      - pasalapeli-net

  ticket-service:
    container_name: pasalapeli-ticket
    restart: unless-stopped
    build:
      context: ../pasalapeli-ticket-service
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Definir SPRING_DATASOURCE_URL en .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-pasalapeli}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pasalapeli123}
      MOVIE_SERVICE_URL: http://movie-service:8082
      AZURE_AUTH_ENABLED: ${AZURE_AUTH_ENABLED:-true}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      AZURE_APP_ID_URI: ${AZURE_APP_ID_URI:-api://00000000-0000-0000-0000-000000000000}
      AZURE_AD_ISSUER_URI: ${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/common/v2.0}
      AZURE_AD_JWK_SET_URI: ${AZURE_AD_JWK_SET_URI:-https://login.microsoftonline.com/common/discovery/v2.0/keys}
      # Mensajeria asincrona (AWS SNS); credenciales via IMDS/LabRole
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
      # Token interno para llamar a movie-service /descontar|/reponer
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
    depends_on:
      movie-service:
        condition: service_started
    networks:
      - pasalapeli-net

  notification-service:
    container_name: pasalapeli-notification
    restart: unless-stopped
    build:
      context: ../pasalapeli-notification-service
    # Sin publicacion de puerto: solo alcanzable por la red interna del compose (BFF).
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Definir SPRING_DATASOURCE_URL en .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-pasalapeli}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pasalapeli123}
      AZURE_AUTH_ENABLED: ${AZURE_AUTH_ENABLED:-true}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      AZURE_APP_ID_URI: ${AZURE_APP_ID_URI:-api://00000000-0000-0000-0000-000000000000}
      AZURE_AD_ISSUER_URI: ${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/common/v2.0}
      AZURE_AD_JWK_SET_URI: ${AZURE_AD_JWK_SET_URI:-https://login.microsoftonline.com/common/discovery/v2.0/keys}
      # Consumo asincrono (AWS SQS + DLQ); credenciales via IMDS/LabRole
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_QUEUE_URL: ${SQS_QUEUE_URL:-}
      SQS_DLQ_URL: ${SQS_DLQ_URL:-}
    depends_on:
      movie-service:
        condition: service_started
      ticket-service:
        condition: service_started
    networks:
      - pasalapeli-net

  bff-service:
    container_name: pasalapeli-bff
    restart: unless-stopped
    build:
      context: ../pasalapeli-bff-service
    environment:
      AZURE_AUTH_ENABLED: ${AZURE_AUTH_ENABLED:-true}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-00000000-0000-0000-0000-000000000000}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-common}
      AZURE_APP_ID_URI: ${AZURE_APP_ID_URI:-api://00000000-0000-0000-0000-000000000000}
      AZURE_AD_ISSUER_URI: ${AZURE_AD_ISSUER_URI:-https://login.microsoftonline.com/common/v2.0}
      AZURE_AD_JWK_SET_URI: ${AZURE_AD_JWK_SET_URI:-https://login.microsoftonline.com/common/discovery/v2.0/keys}
      MOVIE_SERVICE_URL: http://movie-service:8082
      TICKET_SERVICE_URL: http://ticket-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "8080:8080"
    depends_on:
      movie-service:
        condition: service_started
      ticket-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - pasalapeli-net

volumes:
  movie-uploads:

networks:
  pasalapeli-net:
    driver: bridge
