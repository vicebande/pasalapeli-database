name: Bootstrap EC2 - Pasa La Peli

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita acumular runs de bootstrap: un push nuevo cancela el anterior en curso.
concurrency:
  group: bootstrap-ec2-pasalapeli
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Setup EC2 y despliegue completo
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar bootstrap en el EC2
        env:
          # Secrets de GitHub con fallback a valores de desarrollo
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'root' }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME || 'root' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD || 'root' }}
          AZURE_AUTH_ENABLED: ${{ secrets.AZURE_AUTH_ENABLED || 'false' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID || '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID || '' }}
          AZURE_APP_ID_URI: ${{ secrets.AZURE_APP_ID_URI || '' }}
          AZURE_AD_ISSUER_URI: ${{ secrets.AZURE_AD_ISSUER_URI || '' }}
          AZURE_AD_JWK_SET_URI: ${{ secrets.AZURE_AD_JWK_SET_URI || '' }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL || '' }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || '*' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          # Variables reenviadas al EC2 (definidas como env de este step)
          envs: MYSQL_ROOT_PASSWORD,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,AZURE_AUTH_ENABLED,AZURE_CLIENT_ID,AZURE_TENANT_ID,AZURE_APP_ID_URI,AZURE_AD_ISSUER_URI,AZURE_AD_JWK_SET_URI,SPRING_DATASOURCE_URL,CORS_ALLOWED_ORIGINS
          script: |
            set -euo pipefail

            # Lock compartido con los deploys por-repo (movie/ticket/bff) sobre EC2-APPS:
            # el bootstrap tambien ejecuta docker compose up y no debe correr en paralelo.
            LOCKFILE=/tmp/pasalapeli-deploy.lock
            exec 9>"$LOCKFILE"
            flock -x -w 1800 9
            echo "==> Lock adquirido $LOCKFILE (bootstrap)"

            REPO_OWNER="${{ github.repository_owner }}"
            CERTBOT_EMAIL="${{ vars.CERTBOT_EMAIL }}"
            DOMAIN="${{ vars.EC2_DOMAIN }}"
            if [ -n "$DOMAIN" ]; then
              APP_BASE_URL="https://$DOMAIN"
              CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-https://$DOMAIN}"
            else
              # Modo pruebas sin dominio: self-signed + CORS del secret (o * por defecto)
              APP_BASE_URL="https://localhost"
              CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-*}"
            fi
            # Exportar para que bootstrap-ec2.sh (subproceso) las reciba
            export APP_BASE_URL CERTBOT_EMAIL CORS_ALLOWED_ORIGINS DOMAIN REPO_OWNER SPRING_DATASOURCE_URL

            if [ -d /opt/pasalapeli/pasalapeli-database/.git ]; then
              cd /opt/pasalapeli/pasalapeli-database
              git pull --ff-only origin main
            else
              sudo mkdir -p /opt/pasalapeli
              sudo chown "$(whoami)" /opt/pasalapeli
              git clone "https://github.com/$REPO_OWNER/pasalapeli-database.git" /opt/pasalapeli/pasalapeli-database
              cd /opt/pasalapeli/pasalapeli-database
            fi

            # Carga el .env existente SOLO para claves que NO vengan ya
            # definidas por los secrets/variables del workflow. Asi los nuevos
            # valores de AZURE_* no son pisados por los viejos del servidor.
            set +u
            if [ -f /opt/pasalapeli/pasalapeli-database/.env ]; then
              while IFS='=' read -r _key _val; do
                case "$_key" in ''|*\#*) continue;; esac
                if [ -z "${!_key:-}" ]; then
                  export "$_key=$_val"
                fi
              done < /opt/pasalapeli/pasalapeli-database/.env
            fi
            set -u
            # Aplicar secrets de Azure: forzar la regeneracion completa del .env
            export FORCE_ENV=true

            bash scripts/bootstrap-ec2.sh
            flock -u 9
